[package]
name = "pressing-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "2ndPressing command-line tool: declick files, benchmark, fixture parity"

[[bin]]
name = "pressing"
path = "src/main.rs"

[dependencies]
pressing-core = { path = "../pressing-core" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
hound = "3.5"
same-file = "1"
serde_json = "1"
symphonia = { version = "0.5", default-features = false, features = ["aac", "alac", "flac", "pcm", "isomp4", "wav", "aiff"] }

[dev-dependencies]
serde_json = "1"
tempfile = "3"
