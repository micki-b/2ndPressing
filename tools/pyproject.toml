[project]
name = "pressing-tools"
version = "0.1.0"
description = "2ndPressing data preparation and training tools"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "soundfile>=0.12",
]

[project.scripts]
pressing-labels = "pressing_tools.labels:main"
pressing-dataset = "pressing_tools.dataset:main"
pressing-eval = "pressing_tools.evaluate:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pressing_tools"]
